name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Transfer-windows
          - os: macos-latest # Apple Silicon
            artifact: Transfer-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name Transfer transfer.py
      # artifact uploads drop the executable bit, so ship the Mac binary inside its own zip
      - if: runner.os == 'macOS'
        run: cd dist && zip -m Transfer-mac.zip Transfer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
